# Fly.io deployment. Chosen because the app needs a persistent disk for SQLite;
# a serverless target would lose the database on every cold start.
#
#   fly launch --no-deploy          # creates the app, keeps this file
#   fly volumes create md_data --size 1 --region <your-region>
#   fly deploy
#
# Change `app` to a name you own before deploying.

app = "mobile-dinners"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  MD_DATA_DIR = "/data"
  PORT = "3000"

# SQLite means exactly one writer. Do not scale this past a single machine
# without moving to Postgres first.
[mounts]
  source = "md_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
